[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-signal-ea"
version = "0.1.0"
description = "Automated Telegram signal parser and MT5 trading execution system"
readme = "README.md"
requires-python = ">=3.12.7"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "telethon==1.40.0",
    "python-dotenv==1.0.1",
    "aiofiles>=24.1.0",
    "sqlalchemy==2.0.43",
    "aiosqlite==0.20.0",
    "openai==1.99.1",
    "apscheduler==3.10.4",
    "orjson==3.10.12",
    "pendulum==3.0.0",
    "aiohttp==3.11.11",
    "MetaTrader5==5.0.5200",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==0.25.0",
    "pytest-mock==3.14.0",
    "mypy==1.13.0",
    "black==24.10.0",
    "ruff==0.8.4",
]

[project.scripts]
telegram-signal-ea = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "MetaTrader5.*",
    "telethon.*",
    "apscheduler.*",
]
ignore_missing_imports = true